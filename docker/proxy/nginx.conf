# Serves the "single" node under a path prefix, the way a gateway or ingress
# often exposes Elasticsearch:  http://localhost:9280/es/<path>  ->  es-single:9200/<path>
#
# This is the canonical prefix-stripping setup (proxy_pass with a URI part):
# nginx decodes the request path, swaps the /es/ prefix for /, and re-escapes
# it, so a correctly percent-encoded index name such as esticli-100%25-percent
# arrives as ES expects. (Slicing $request_uri with a regex capture instead
# double-encodes: nginx re-escapes captures whenever the URI contained %XX.)
# A path that isn't valid percent-encoding is rejected by nginx with a 400.

upstream es_single {
    server es-single:9200;
    keepalive 16;
}

log_format esticli '$remote_addr "$request" $status $body_bytes_sent ${request_time}s';

server {
    listen 80;
    access_log /dev/stdout esticli;
    client_max_body_size 200m;

    # The bare prefix is the cluster root (GET /es -> GET /), no redirect.
    location = /es {
        proxy_pass http://es_single/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /es/ {
        proxy_pass http://es_single/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Anything outside the prefix: a client that dropped the base path ends
    # up here, so say exactly that instead of a bare 404.
    location / {
        default_type application/json;
        return 404 '{"error":"esticli-proxy: request outside the /es/ prefix (the client dropped the base path?)","path":"$request_uri"}\n';
    }
}
